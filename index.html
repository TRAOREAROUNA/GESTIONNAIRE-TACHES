
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de tâches</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Mon gestionnaire de tâches</h1>


<section id="task-dashboard">
    <h2>Tableau de bord</h2>

    <div class="dashboard-cards">
        <article class="dashboard-card card-total">
            <h3>Total des tâches</h3>
            <p id="dashboard-total">0</p>
        </article>

        <article class="dashboard-card card-completed">
            <h3>Tâches terminées</h3>
            <p id="dashboard-completed">0</p>
        </article>

        <article class="dashboard-card card-remaining">
            <h3>Tâches restantes</h3>
            <p id="dashboard-remaining">0</p>
        </article>

        <article class="dashboard-card card-overdue">
            <h3>Tâches en retard</h3>
            <p id="dashboard-overdue">0</p>
        </article>
    </div>

    <div class="dashboard-progress">
        <p>
            Progression globale :
            <strong id="dashboard-progress">0%</strong>
        </p>

        <div class="progress-track">
            <div id="dashboard-progress-bar" class="progress-fill"></div>
        </div>
    </div>
</section>


        <p id="task-counter">Nombre de tâches : 0</p>

        <form id="task-form">
            <input id="task-input" type="text"
                   placeholder="Nouvelle tâche..." required>
            
<label for="task-due-date">Date limite :</label>
<input id="task-due-date" type="date">

<label for="task-priority">Priorité :</label>
<select id="task-priority">
    <option value="basse">Basse</option>
    <option value="moyenne" selected>Moyenne</option>
    <option value="haute">Haute</option>
</select>

<button type="submit">Ajouter</button>


        </form>

<div id="task-filters">
    <button type="button" data-filter="all">Toutes</button>
    <button type="button" data-filter="active">Restantes</button>
    <button type="button" data-filter="completed">Terminées</button>
</div>


<div id="task-search">
    <label for="task-search-input">Rechercher une tâche :</label>
    <input
        id="task-search-input"
        type="search"
        placeholder="Saisir un mot-clé..."
    >
</div>
<div id="task-backup">
    <button type="button" id="export-tasks">
        Exporter les tâches
    </button>

    <label for="import-file">Importer des tâches :</label>
    <input
        type="file"
        id="import-file"
        accept=".json,application/json"
    >
</div>

<div id="task-sorting">
    <label for="task-sort">Trier les tâches :</label>
    <select id="task-sort">
        <option value="default">Ordre actuel</option>
        <option value="priority">Priorité : haute vers basse</option>
        <option value="due-date">Date limite : la plus proche</option>
    </select>
</div>

        <ul id="task-list"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
