
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser mon mot de passe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section>
      <h2>Réinitialiser mon mot de passe</h2>

      <p>Choisissez un nouveau mot de passe.</p>

      <form id="reset-password-form">
        <div class="password-container">
          <input
            type="password"
            id="new-password"
            placeholder="Nouveau mot de passe"
            minlength="8"
            maxlength="72"
            required
          >
          <button type="button" class="toggle-password"
            data-target="new-password">Afficher</button>
        </div>

        <div class="password-container">
          <input
            type="password"
            id="confirm-password"
            placeholder="Confirmer le nouveau mot de passe"
            minlength="8"
            maxlength="72"
            required
          >
          <button type="button" class="toggle-password"
            data-target="confirm-password">Afficher</button>
        </div>

        <button type="submit">Enregistrer le nouveau mot de passe</button>
      </form>

      <p id="reset-message"></p>

      <a href="/">Retour à la connexion</a>
    </section>
  </main>

  <script src="reset-password.js"></script>
</body>
</html>
